<script>
/* AI Career — общий слой: i18n (RU/KK/EN), единые Header/Footer, тосты.
   Встроен в каждую страницу. */
(function () {
  const D = {
    ru: { nav_home: 'Главная', nav_dash: 'Кабинет', nav_resume: 'Анализ резюме', nav_roadmap: 'Roadmap', nav_jobs: 'Вакансии',
      login: 'Вход', start: 'Запустить ИИ-анализ', login_toast: 'Вход через портал ТехноИнноПарка скоро будет доступен',
      f_about: 'Экосистема профориентации и карьерного трекинга студентов.', f_nav: 'Разделы', f_contact: 'Контакты', f_rights: '© 2026 ТехноИнноПарк. Все права защищены.' },
    kk: { nav_home: 'Басты бет', nav_dash: 'Кабинет', nav_resume: 'Резюме талдауы', nav_roadmap: 'Roadmap', nav_jobs: 'Вакансиялар',
      login: 'Кіру', start: 'ЖИ-талдауды бастау', login_toast: 'ТехноИнноПарк порталы арқылы кіру жақында қолжетімді болады',
      f_about: 'Студенттерге арналған кәсіби бағдар және мансап трекингі экожүйесі.', f_nav: 'Бөлімдер', f_contact: 'Байланыс', f_rights: '© 2026 ТехноИнноПарк. Барлық құқықтар қорғалған.' },
    en: { nav_home: 'Home', nav_dash: 'Dashboard', nav_resume: 'Resume Lab', nav_roadmap: 'Roadmap', nav_jobs: 'Jobs',
      login: 'Sign in', start: 'Run AI analysis', login_toast: 'Sign-in via the TechnoInnoPark portal is coming soon',
      f_about: 'A career guidance and tracking ecosystem for students.', f_nav: 'Sections', f_contact: 'Contact', f_rights: '© 2026 TechnoInnoPark. All rights reserved.' }
  };
  const LOCALES = { ru: 'ru-RU', kk: 'kk-KZ', en: 'en-GB' };
  const PAGES = [['index.html', 'nav_home'], ['dashboard.html', 'nav_dash'], ['resume-analyzer.html', 'nav_resume'], ['roadmap.html', 'nav_roadmap'], ['vacancies.html', 'nav_jobs']];
  let lang = 'ru';
  try { lang = localStorage.getItem('aic_lang') || 'ru'; } catch (e) {}
  if (!D[lang]) lang = 'ru';

  const AI = {
    get lang() { return lang; },
    get locale() { return LOCALES[lang]; },
    add(dict) { for (const l in dict) Object.assign(D[l], dict[l]); },
    t(k) { return (D[lang] && D[lang][k]) || D.ru[k] || k; },
    apply(root) {
      (root || document).querySelectorAll('[data-i18n]').forEach(el => { el.textContent = AI.t(el.dataset.i18n); });
      document.documentElement.lang = lang;
    },
    setLang(l) {
      lang = l;
      try { localStorage.setItem('aic_lang', l); } catch (e) {}
      document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l));
      AI.apply();
      document.dispatchEvent(new CustomEvent('langchange', { detail: l }));
    },
    toast(msg, type) {
      let box = document.getElementById('toasts');
      if (!box) { box = document.createElement('div'); box.id = 'toasts'; box.className = 'fixed bottom-5 right-5 z-[100] flex flex-col gap-2'; document.body.appendChild(box); }
      const el = document.createElement('div');
      el.className = 'glass rounded-xl px-4 py-3 text-sm flex items-center gap-3 shadow-2xl transition-all duration-300 translate-y-2 opacity-0 max-w-xs';
      el.innerHTML = '<i class="fa-solid ' + (type === 'error' ? 'fa-circle-exclamation text-rose-400' : 'fa-circle-check text-cyan-300') + '"></i><span></span>';
      el.lastChild.textContent = msg;
      box.appendChild(el);
      requestAnimationFrame(() => el.classList.remove('translate-y-2', 'opacity-0'));
      setTimeout(() => { el.classList.add('opacity-0'); setTimeout(() => el.remove(), 300); }, 3200);
    },
    init(active) {
      const links = (cls) => PAGES.map(([h, k]) =>
        '<a href="' + h + '" data-i18n="' + k + '" class="' + cls + (h === active ? ' is-active' : '') + '"' + (h === active ? ' aria-current="page"' : '') + '></a>').join('');
      const langs = ['ru', 'kk', 'en'].map((l, i) => '<button data-lang="' + l + '" aria-pressed="' + (l === lang) + '" class="lang-btn" title="' + ['Русский', 'Қазақша', 'English'][i] + '">' + ['🇷🇺 RU', '🇰🇿 KK', '🇬🇧 EN'][i] + '</button>').join('');
      document.getElementById('hdr').innerHTML =
        '<header class="fixed top-0 inset-x-0 z-50 glass border-x-0 border-t-0"><div class="max-w-7xl mx-auto px-4 h-16 flex items-center gap-4">' +
        '<a href="index.html" class="flex items-center gap-2 font-display font-semibold shrink-0"><span class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-cyan-400 grid place-items-center text-slate-950"><i class="fa-solid fa-microchip"></i></span><span class="hidden sm:inline">ТехноИнноПарк <span class="text-slate-500">|</span> <span class="text-cyan-300">AI Career</span></span></a>' +
        '<nav class="hidden lg:flex items-center gap-1 mx-auto">' + links('nav-link') + '</nav>' +
        '<div class="ml-auto flex items-center gap-2"><div class="flex rounded-lg bg-slate-900/70 p-0.5">' + langs + '</div>' +
        '<button id="login-btn" class="hidden md:block px-3 py-2 text-sm text-slate-300 hover:text-white" data-i18n="login"></button>' +
        '<a href="resume-analyzer.html" class="hidden md:block px-4 py-2 rounded-lg text-sm font-semibold bg-gradient-to-r from-indigo-500 to-cyan-400 text-slate-950 hover:brightness-110" data-i18n="start"></a>' +
        '<button id="burger" class="lg:hidden w-10 h-10 rounded-lg bg-slate-900/70" aria-label="Menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button></div></div>' +
        '<nav id="mnav" class="hidden lg:hidden px-4 pb-4 flex-col gap-1">' + links('block px-3 py-2 rounded-lg nav-link') + '</nav></header>';
      document.getElementById('ftr').innerHTML =
        '<footer class="border-t border-white/10 mt-24"><div class="max-w-7xl mx-auto px-4 py-12 grid gap-8 md:grid-cols-3 text-sm text-slate-400">' +
        '<div><div class="font-display text-white mb-2">ТехноИнноПарк | AI Career</div><p data-i18n="f_about"></p></div>' +
        '<div><div class="text-white mb-2" data-i18n="f_nav"></div><div class="flex flex-col gap-1">' + links('hover:text-cyan-300') + '</div></div>' +
        '<div><div class="text-white mb-2" data-i18n="f_contact"></div><p>Kokshetau, Kazakhstan</p><p>career@technoinnopark.example</p></div></div>' +
        '<div class="text-center text-xs text-slate-500 pb-8" data-i18n="f_rights"></div></footer>';
      document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => AI.setLang(b.dataset.lang)));
      document.getElementById('login-btn').addEventListener('click', () => AI.toast(AI.t('login_toast')));
      const burger = document.getElementById('burger'), mnav = document.getElementById('mnav');
      burger.addEventListener('click', () => { const open = mnav.classList.toggle('hidden') === false; mnav.classList.toggle('flex', open); burger.setAttribute('aria-expanded', open); });
      AI.apply();
    }
  };
  window.AI = AI;
})();
</script>
<script>
/*CORE*/
const SK=[['c1','Python'],['c1','JavaScript'],['c1','TypeScript'],['c1','Java'],['c1','SQL'],['c1','C++'],['c1','C#'],['c1','PHP'],['c1','Kotlin'],
['c2','React'],['c2','Vue'],['c2','Angular'],['c2','Django'],['c2','FastAPI'],['c2','Flask'],['c2','Node.js'],['c2','Pandas'],
['c3','Git'],['c3','Docker'],['c3','Kubernetes'],['c3','Linux'],['c3','PostgreSQL'],['c3','MySQL'],['c3','MongoDB'],['c3','Redis'],['c3','AWS'],['c3','Azure'],['c3','CI/CD'],['c3','Terraform'],['c3','Figma'],['c3','Jira'],['c3','Networking',/networking|(?<![\p{L}])сети(?![\p{L}])|\bTCP\b/iu]];
const SOFT=[['Teamwork',/командн|teamwork|team player/i],['Communication',/коммуникац|communication/i],['Presentations',/презентац|presentation|public speaking/i],['Leadership',/лидер|leadership/i],['Scrum / Agile',/scrum|agile/i],['Time management',/тайм-менеджмент|time management/i]];
const TY=[['пркатик','практик'],['комманд','команд'],['програмист','программист'],['пожалуста','пожалуйста'],['вообщем','в общем'],['developement','development'],['recieve','receive'],['experiance','experience'],['managment','management'],['knowlege','knowledge'],['seperate','separate'],['langauge','language'],['enviroment','environment']];
const VAC=[['DevOps Intern · QazCloud',['Linux','Docker','Git','Kubernetes','CI/CD']],['Junior Python · Steppe Pay',['Python','FastAPI','SQL','Docker']],['ML Placement · Altyn Data',['Python','Pandas','SQL']],['Junior React · Tengri Soft',['React','TypeScript','Git']],['Security Intern · Nomad Secure',['Linux','Networking','Python']],['Full-Stack Intern · Baiterek Labs',['Python','React','SQL','Docker']]];
const esc=s=>s.replace(/[.*+?^${}()|[\]\\\/]/g,'\\$&');
const HEAD=/^(о себе|обо мне|summary|profile|образование|education|опыт(?: работы)?|experience|work experience|проекты|projects|навыки|технические навыки|skills|языки|languages|курсы|сертификаты|certificates)\s*:?$/i;
const EXP=/^(опыт|experience|work experience|проекты|projects)/i;
const WEAK=/^(участвовал[аи]?|помогал[аи]?|занимал(?:ся|ась|ись)|работал[аи]?|делал[аи]?|отвечал[аи]?|принимал[аи]? участие|participated|helped|worked on|responsible for|assisted|involved in|did)(?![\p{L}])/iu;
const METRIC=/\d+\s?%|\d[\d\s]*\s?(?:мин|сек|ч\b|час|пользовател|клиент|тыс|млн|раз|users|customers|min|sec|hours|ms|мс|k\b)|\bс\s?\d+\s?до\s?\d+|from \d+ to \d+|\d{3,}/i;
function analyze(raw){
 const text=raw.replace(/\r/g,''),lines=text.split('\n').map(s=>s.trim()).filter(Boolean);
 const words=(text.match(/[\p{L}\d][\p{L}\d+#./-]*/gu)||[]).length,I=[],sk={c1:[],c2:[],c3:[],c4:[]},has={};
 const typos=new Set();
 TY.forEach(([w,r])=>{const m=text.match(new RegExp(w+'[\\p{L}]*','iu'));if(m)typos.add(m[0]+' → '+m[0].replace(new RegExp(w,'i'),r))});
 const rep=text.match(/(?<![\p{L}])([\p{L}]{3,})\s+\1(?![\p{L}])/giu);if(rep)rep.slice(0,2).forEach(x=>typos.add('«'+x+'»'));
 const cases=new Set();
 SK.forEach(([c,n,re])=>{const g=re||new RegExp('(?<![\\p{L}\\d])'+esc(n)+'(?![\\p{L}\\d])','giu');const ms=text.match(g)||[];
  if(ms.length){has[n]=1;sk[c].push(n);}
  if(!re)ms.forEach(m=>{if(m!==n)cases.add(m+' → '+n)});});
 SOFT.forEach(([n,re])=>{if(re.test(text))sk.c4.push(n)});
 // experience items
 let inExp=false,area=[];
 lines.forEach(l=>{if(HEAD.test(l)){inExp=EXP.test(l);return}if(inExp)area.push(l)});
 if(!area.length)area=lines.filter(l=>!HEAD.test(l));
 const items=[];
 area.forEach(l=>{const b=/^[•\-–*·▪]\s*/.test(l),t=l.replace(/^[•\-–*·▪]\s*/,'');
  if(!b&&items.length&&/^\p{Ll}/u.test(t)&&!/[.!?;]$/.test(items[items.length-1]))items[items.length-1]+=' '+t;else items.push(t);});
 const bullets=items.filter(t=>t.length>=30&&/[.!?;]$/.test(t));
 const noMetric=bullets.filter(t=>!METRIC.test(t.replace(/\b(19|20)\d{2}\b/g,'')));
 const weak=bullets.filter(t=>WEAK.test(t)).map(t=>t.match(WEAK)[0]);
 const email=/[\w.+-]+@[\w-]+\.[\w.-]+/.test(text),phone=/\+?\d[\d\s()-]{8,}\d/.test(text),links=/github\.com|linkedin\.com|gitlab\.com/i.test(text);
 const sec={edu:/образование|education|университет|university/i.test(text),exp:/опыт|experience|проект|project/i.test(text),skills:/навыки|skills/i.test(text)};
 const missing=Object.keys(sec).filter(k=>!sec[k]),nsk=Object.values(sk).flat().length;
 let pen=0;
 if(typos.size){I.push({k:'typo',x:[...typos].slice(0,4).join('; ')});pen+=Math.min(typos.size*4,12)}
 if(cases.size){I.push({k:'case',x:[...cases].slice(0,3).join('; ')});pen+=Math.min(cases.size*3,9)}
 if(bullets.length&&noMetric.length/bullets.length>=.4){I.push({k:'nom',n:noMetric.length,m:bullets.length,x:'«'+noMetric[0].slice(0,60)+'…»'});pen+=Math.round(20*noMetric.length/bullets.length)}
 if(weak.length){I.push({k:'weak',x:[...new Set(weak.map(w=>w.toLowerCase()))].slice(0,5).join(', ')});pen+=Math.min(weak.length*3,12)}
 if(!email){I.push({k:'noemail'});pen+=10}
 if(!phone){I.push({k:'nophone'});pen+=5}
 if(missing.length){I.push({k:'nosec',x:missing.join(',')});pen+=missing.length*6}
 if(words<120){I.push({k:'short',x:words});pen+=10}
 if(nsk<5){I.push({k:'fewsk',x:nsk});pen+=8}
 if(!links){I.push({k:'nolink'});pen+=3}
 const city=/кокшетау|астана|алматы|караганд|шымкент|павлодар|kokshetau|astana|almaty|karaganda/i.test(text),lang=/казахск|русск|english|английск|kazakh|russian/i.test(text),eng=/\b[ABC][12]\b|ielts|toefl/i.test(text);
 const kz=[];if(!city)kz.push('k_city');if(!links)kz.push('k_gh');if(!lang)kz.push('k_lang');kz.push('k_gen');
 const gl=[];if(!eng)gl.push('g_eng');if(!links)gl.push('g_oss');if(words>700)gl.push('g_len');gl.push('g_pat');
 const vac=VAC.map(([n,r])=>[n,Math.round(r.filter(s=>has[s]).length/r.length*100)]).sort((a,b)=>b[1]-a[1]).slice(0,3);
 return{score:Math.max(0,Math.min(100,100-pen)),issues:I,skills:sk,words,kz,gl,vac,checks:{email,phone,sections:!missing.length,links,metrics:!!bullets.length&&noMetric.length/bullets.length<.4,length:words>=120&&words<=900}};}

const DEMO1=`Асель Нурланова\nСтудентка 3 курса, Software Engineering · Кокшетау, Казахстан\n+7 700 000 00 00 · asel.nurlanova@example.com · github.com/asel-demo\nО себе\nСтудентка-программист. Хочу работать в IT-компании и развиваться как backend и web разработчик. Ответственная, быстро учусь.\nОбразование\nКокшетауский университет, Software Engineering, бакалавриат, 2023 – 2027\nОпыт\nСтуденческая лаборатория, учебная пркатика · 2025\n• Участвовала в разработке веб-приложения для учета заказов на Python и Javascript.\n• Помогала команде с базой данных PostgreSQL и написанием запросов.\n• Работала в комманде из 4 человек, делала разные задачи по проекту.\nPet-проект: Telegram-бот для расписания · 2024\n• Сделала бота на Python, который показывает расписание занятий.\n• Занималась деплоем на сервер и настройкой Docker.\nНавыки\nЯзыки: Python, JavaScript, SQL, Java\nФреймворки: React, FastAPI, Django\nИнструменты: Git, Docker, Linux\nSoft skills: командная работа, презентации\nЯзыки\nКазахский — родной · Русский — свободно · English — B1`;

 $('lamp').className=`inline-block px-3 py-1 rounded-full text-sm bg-${c}-400/15 text-${c}-300`;$('lamp').textContent='● '+AI.t(s>=80?'l_hi':s>=50?'l_mid':'l_lo');

 $('tree').innerHTML=TR.map(k=>`<div><div class="text-xs text-slate-400 mb-1">${TN[k][AI.lang]}</div><div class="flex flex-wrap gap-2">${r.skills[k].map(x=>`<span class="chip text-cyan-200">${x}</span>`).join('')||'<span class="text-slate-500 text-sm">—</span>'}</div></div>`).join('');
 $('tabs').innerHTML=['kz','gl'].map(g=>`<button data-r="${g}" class="chip ${g===region?'bg-indigo-500 border-indigo-500':''}">${AI.t(g)}</button>`).join('');

async function pdfText(buf){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
 const d=await pdfjsLib.getDocument({data:buf}).promise;let out='';
 for(let i=1;i<=d.numPages;i++){const c=await(await d.getPage(i)).getTextContent();let y=null;for(const it of c.items){const yy=it.transform[5];if(y!==null&&Math.abs(yy-y)>3)out+='\n';out+=it.str;if(it.hasEOL)out+='\n';y=yy}out+='\n'}return out}
async function docxText(buf){return(await mammoth.extractRawText({arrayBuffer:buf})).value}
async function run(name,getText){$('scan').classList.remove('hidden');$('rep').classList.add('hidden');$('fname').textContent=name;$('bar').style.width='0';last=null;
 $('steps').innerHTML=[1,2,3,4].map(i=>`<li class="flex gap-3 text-slate-500" id="s${i}"><i class="fa-regular fa-circle mt-1"></i>${AI.t('st'+i)}</li>`).join('');
 let res;const p=Promise.resolve().then(getText).then(t=>{if(!t||t.replace(/\s/g,'').length<30)throw new Error('notext');return analyze(t)});p.catch(()=>{});
 for(let i=1;i<=4;i++){await sleep(650);if(i===2){try{res=await p}catch(e){$('scan').classList.add('hidden');return AI.toast(AI.t(e.message==='notext'?'notext':'liberr'),'error')}}
  $('bar').style.width=i*25+'%';$('s'+i).className='flex gap-3 text-emerald-300';$('s'+i).firstChild.className='fa-solid fa-circle-check mt-1';}
 last=res;$('rep').classList.remove('hidden');report();AI.toast(AI.t('done'));}
function take(f){if(!/\.(pdf|docx)$/i.test(f.name))return AI.toast(AI.t('badfmt'),'error');if(f.size>5*1024*1024)return AI.toast(AI.t('big'),'error');
 run(f.name+' ('+Math.ceil(f.size/1024)+' KB)',async()=>{const b=await f.arrayBuffer();return/\.pdf$/i.test(f.name)?pdfText(b):docxText(b)})}
$('pick').onclick=()=>$('file').click();$('file').onchange=e=>{e.target.files[0]&&take(e.target.files[0]);e.target.value=''};
