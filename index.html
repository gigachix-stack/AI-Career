<style>

  .tilt{transform-style:preserve-3d;transition:transform .15s ease-out}
  .skeleton{position:relative;overflow:hidden;background:rgba(148,163,184,.12);border-radius:.5rem}
  .skeleton::after{content:"";position:absolute;inset:0;background:linear-gradient(90deg,transparent,rgba(255,255,255,.12),transparent);animation:sh 1.2s infinite}
  @keyframes sh{from{transform:translateX(-100%)}to{transform:translateX(100%)}}
  .step-btn[aria-selected=true]{border-color:var(--cyan);background:rgba(34,211,238,.1)}
  .lift{transition:transform .25s,border-color .25s}.lift:hover{transform:translateY(-4px);border-color:rgba(34,211,238,.5)}

<script>
/* AI Career — общий слой: i18n (RU/KK/EN), единые Header/Footer, тосты.
   Встроен в каждую страницу. */
(function () {
  const D = {
    ru: { nav_home: 'Главная', nav_dash: 'Кабинет', nav_resume: 'Анализ резюме', nav_roadmap: 'Roadmap', nav_jobs: 'Вакансии',
      login: 'Вход', start: 'Запустить ИИ-анализ', login_toast: 'Вход через портал ТехноИнноПарка скоро будет доступен',

  const LOCALES = { ru: 'ru-RU', kk: 'kk-KZ', en: 'en-GB' };
  const PAGES = [['index.html', 'nav_home'], ['dashboard.html', 'nav_dash'], ['resume-analyzer.html', 'nav_resume'], ['roadmap.html', 'nav_roadmap'], ['vacancies.html', 'nav_jobs']];
  let lang = 'ru';
  try { lang = localStorage.getItem('aic_lang') || 'ru'; } catch (e) {}

  const AI = {
    get lang() { return lang; },
    get locale() { return LOCALES[lang]; },
    add(dict) { for (const l in dict) Object.assign(D[l], dict[l]); },
    t(k) { return (D[lang] && D[lang][k]) || D.ru[k] || k; },
    apply(root) {
      (root || document).querySelectorAll('[data-i18n]').forEach(el => { el.textContent = AI.t(el.dataset.i18n); });

    },
    setLang(l) {
      lang = l;
      try { localStorage.setItem('aic_lang', l); } catch (e) {}
      document.querySelectorAll('[data-lang]').forEach(b => b.setAttribute('aria-pressed', b.dataset.lang === l));

    toast(msg, type) {

      box.appendChild(el);
      requestAnimationFrame(() => el.classList.remove('translate-y-2', 'opacity-0'));

    init(active) {
      const links = (cls) => PAGES.map(([h, k]) =>

        '<a href="index.html" class="flex items-center gap-2 font-display font-semibold shrink-0"><span class="w-8 h-8 rounded-lg bg-gradient-to-br from-indigo-500 to-cyan-400 grid place-items-center text-slate-950"><i class="fa-solid fa-microchip"></i></span><span class="hidden sm:inline">ТехноИнноПарк <span class="text-slate-500">|</span> <span class="text-cyan-300">AI Career</span></span></a>' +
        '<nav class="hidden lg:flex items-center gap-1 mx-auto">' + links('nav-link') + '</nav>' +
        '<div class="ml-auto flex items-center gap-2"><div class="flex rounded-lg bg-slate-900/70 p-0.5">' + langs + '</div>' +
        '<button id="login-btn" class="hidden md:block px-3 py-2 text-sm text-slate-300 hover:text-white" data-i18n="login"></button>' +
        '<a href="resume-analyzer.html" class="hidden md:block px-4 py-2 rounded-lg text-sm font-semibold bg-gradient-to-r from-indigo-500 to-cyan-400 text-slate-950 hover:brightness-110" data-i18n="start"></a>' +
        '<button id="burger" class="lg:hidden w-10 h-10 rounded-lg bg-slate-900/70" aria-label="Menu" aria-expanded="false"><i class="fa-solid fa-bars"></i></button></div></div>' +
        '<nav id="mnav" class="hidden lg:hidden px-4 pb-4 flex-col gap-1">' + links('block px-3 py-2 rounded-lg nav-link') + '</nav></header>';
      document.getElementById('ftr').innerHTML =
        '<footer class="border-t border-white/10 mt-24"><div class="max-w-7xl mx-auto px-4 py-12 grid gap-8 md:grid-cols-3 text-sm text-slate-400">' +
        '<div><div class="font-display text-white mb-2">ТехноИнноПарк | AI Career</div><p data-i18n="f_about"></p></div>' +
        '<div><div class="text-white mb-2" data-i18n="f_nav"></div><div class="flex flex-col gap-1">' + links('hover:text-cyan-300') + '</div></div>' +
        '<div><div class="text-white mb-2" data-i18n="f_contact"></div><p>Kokshetau, Kazakhstan</p><p>career@technoinnopark.example</p></div></div>' +
        '<div class="text-center text-xs text-slate-500 pb-8" data-i18n="f_rights"></div></footer>';
      document.querySelectorAll('[data-lang]').forEach(b => b.addEventListener('click', () => AI.setLang(b.dataset.lang)));
      document.getElementById('login-btn').addEventListener('click', () => AI.toast(AI.t('login_toast')));
      const burger = document.getElementById('burger'), mnav = document.getElementById('mnav');
      burger.addEventListener('click', () => { const open = mnav.classList.toggle('hidden') === false; mnav.classList.toggle('flex', open); burger.setAttribute('aria-expanded', open); });
      AI.apply();
    }
  };
  window.AI = AI;
})();
</script>

// Typed headline (restarts on language change)
let tTimer;
function typeLoop(){
  clearTimeout(tTimer);
  const el=document.getElementById('typed'),words=AI.t('typed').split('|');
  if(matchMedia('(prefers-reduced-motion:reduce)').matches){el.textContent=words[0];return;}
  let w=0,i=0,del=false;
  (function tick(){
    const s=words[w];
    el.textContent=s.slice(0,i);
    if(!del&&i===s.length){del=true;tTimer=setTimeout(tick,1600);return;}
    if(del&&i===0){del=false;w=(w+1)%words.length;}
    i+=del?-1:1;
    tTimer=setTimeout(tick,del?25:55);
  })();
}

// 3D tilt card
const card=document.getElementById('tilt');
card.parentElement.addEventListener('mousemove',e=>{const r=card.getBoundingClientRect(),x=(e.clientX-r.left)/r.width-.5,y=(e.clientY-r.top)/r.height-.5;card.style.transform=`rotateY(${x*14}deg) rotateX(${-y*14}deg)`;});
card.parentElement.addEventListener('mouseleave',()=>card.style.transform='');
document.getElementById('card-bars').innerHTML=[['Python',82,'bg-emerald-400'],['React',74,'bg-emerald-400'],['Docker',61,'bg-amber-400']].map(([n,v,c])=>
 `<div><div class="flex justify-between text-sm mb-1"><span>${n}</span><span class="text-slate-400">${v}%</span></div><div class="h-2 rounded-full bg-slate-700/60"><div class="h-2 rounded-full ${c}" style="width:${v}%"></div></div></div>`).join('');

// How it works: interactive steps
const ICONS=['fa-file-lines','fa-chart-simple','fa-route','fa-handshake'];
let cur=0;
function renderSteps(){
  document.getElementById('steps').innerHTML=ICONS.map((ic,i)=>
   `<button role="tab" aria-selected="${i===cur}" data-i="${i}" class="step-btn glass rounded-xl p-4 text-left border flex items-center gap-3 ${i===3?'lg:col-span-1':''}"><i class="fa-solid ${ic} text-cyan-300"></i><span class="text-sm font-semibold">${AI.t('s'+(i+1))}</span></button>`).join('')+'<div class="hidden lg:block"></div>';
  document.getElementById('step-ico').innerHTML=`<i class="fa-solid ${ICONS[cur]}"></i>`;
  document.getElementById('step-h').textContent=AI.t('s'+(cur+1));
  document.getElementById('step-d').textContent=AI.t('s'+(cur+1)+'d');
  document.querySelectorAll('.step-btn').forEach(b=>b.addEventListener('click',()=>{cur=+b.dataset.i;renderSteps();}));
}
setInterval(()=>{if(!document.hidden&&!matchMedia('(prefers-reduced-motion:reduce)').matches&&!document.querySelector('.step-btn:hover')){cur=(cur+1)%4;renderSteps();}},7000);

// Directions with demand charts
const DIRS=[['DevOps Engineer','fa-server',[120,135,150,170,185,210]],['Full-Stack Python/React','fa-code',[310,320,305,340,360,390]],['ML Engineer','fa-brain',[60,72,80,95,110,130]],['Cybersecurity','fa-shield-halved',[45,50,58,66,74,88]]];
let charts=[];
function renderDirs(){
  charts.forEach(c=>c.destroy());charts=[];
  const months=[...Array(6)].map((_,i)=>new Date(2026,i+3,1).toLocaleString(AI.locale,{month:'short'}));
  document.getElementById('dirs').innerHTML=DIRS.map(([n,ic,d],i)=>
   `<article class="glass rounded-2xl p-5 lift"><div class="flex items-center gap-3"><span class="w-10 h-10 rounded-xl bg-indigo-500/25 grid place-items-center text-cyan-300"><i class="fa-solid ${ic}"></i></span><h3 class="font-semibold leading-tight">${n}</h3></div>
    <div class="mt-4 flex items-baseline gap-2"><span class="font-display text-2xl">${d[5]}</span><span class="text-xs text-slate-400">${AI.t('vac')}</span><span class="ml-auto text-xs text-emerald-400">+${Math.round((d[5]/d[0]-1)*100)}%</span></div>
    <div class="mt-3 h-24 skeleton" id="sk${i}"><canvas id="ch${i}" class="opacity-0"></canvas></div></article>`).join('');
  setTimeout(()=>DIRS.forEach(([n,,d],i)=>{
    const sk=document.getElementById('sk'+i),cv=document.getElementById('ch'+i);if(!cv)return;
    sk.classList.remove('skeleton');cv.classList.remove('opacity-0');
    charts.push(new Chart(cv,{type:'line',data:{labels:months,datasets:[{data:d,borderColor:'#22D3EE',backgroundColor:'rgba(34,211,238,.15)',fill:true,tension:.35,pointRadius:0,borderWidth:2}]},
      options:{maintainAspectRatio:false,plugins:{legend:{display:false}},scales:{x:{ticks:{color:'#64748b',font:{size:10}},grid:{display:false}},y:{display:false}}}}));
  }),600);
}

// Partners + reviews
document.getElementById('partners').innerHTML=['Kaspi.kz','Kcell','Beeline KZ','Halyk','Freedom','EPAM'].map(p=>`<span>${p}</span>`).join('');
function renderReviews(){
  document.getElementById('reviews').innerHTML=[1,2,3].map(i=>`<figure class="glass rounded-2xl p-6 lift"><i class="fa-solid fa-quote-left text-indigo-400"></i><blockquote class="mt-3 text-slate-300">${AI.t('r'+i)}</blockquote><figcaption class="mt-4 text-sm text-cyan-300">${AI.t('r'+i+'n')}</figcaption></figure>`).join('');
}

function renderAll(){typeLoop();renderSteps();renderDirs();renderReviews();}
document.addEventListener('langchange',renderAll);
renderAll();
</script>
</body>
</html>
